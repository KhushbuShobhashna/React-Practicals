<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Registration with Countdown</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: white;
      }

      h1 {
        color: orange;
      }

      form {
        margin-top: 20px;
        text-align: center;
      }

      input,
      button {
        padding: 10px;
        margin: 10px;
        font-size: 16px;
        width: 80%;
        max-width: 300px;
      }

      button {
        background-color: orange;
        color: white;
        border: none;
        cursor: pointer;
      }

      .countdown {
        font-size: 24px;
        margin-top: 20px;
        color: red;
      }

      .confirmation {
        color: rgb(120, 200, 0);
        margin-top: 20px;
        font-size: 18px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <h1>Register for the Event</h1>

    <div class="countdown" id="countdown">Loading countdown...</div>

    <form id="registrationForm">
      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
      /><br />
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      /><br />
      <button type="submit">Register</button>
    </form>

    <div class="confirmation" id="confirmation"></div>

    <script>
      // Countdown Timer Logic
      const countdownElement = document.getElementById("countdown");
      let eventStartTime = new Date().getTime() + 10 * 60 * 1000; // 10 minutes from now

      const updateTimer = setInterval(() => {
        const now = new Date().getTime();
        const timeLeft = eventStartTime - now;

        const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

        countdownElement.innerHTML = `Time left: ${minutes}m ${seconds}s`;

        if (timeLeft < 0) {
          clearInterval(updateTimer);
          countdownElement.innerHTML = "Event has started!";
        }
      }, 1000);

      // Form Handling Logic
      const form = document.getElementById("registrationForm");
      const confirmationMessage = document.getElementById("confirmation");

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;

        // Basic validation
        if (!name || !email) {
          alert("Both fields are required!");
          return;
        }

        // Simulate a delay using a Promise and setTimeout
        new Promise((resolve) => {
          setTimeout(() => {
            resolve(
              `Thank you, ${name}! You have registered with the email: ${email}`
            );
          }, 2000); // 2-second delay
        }).then((message) => {
          confirmationMessage.innerHTML = message;
          form.reset(); // Clear the form after submission
        });
      });
    </script>
  </body>
</html>
